name: RAG MCP CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce-mcp-gate:
    name: Commerce MCP & Dense Index Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Set up Python 3.12 venv and dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]" onnxruntime
      - name: Validate corpus digests and build local dense vectors
        run: |
          .venv/bin/python -m scripts.index_commerce --root fixtures/commerce --dense
          test -f fixtures/commerce/vectors.json
      - name: Run commerce scope and retrieval contract tests
        run: .venv/bin/python -m pytest tests/commerce -q
      - name: Verify stdio MCP server handshake and hybrid RRF search
        run: |
          .venv/bin/python - <<'PY'
          import asyncio, sys
          from datetime import timedelta
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def verify():
              params = StdioServerParameters(
                  command=sys.executable,
                  args=["-m", "src.mcp_server.commerce_server"],
                  env={
                      "COMMERCE_TENANT_ID": "demo-tenant",
                      "COMMERCE_CORPUS_ROOT": "fixtures/commerce",
                      "COMMERCE_DENSE_ENABLED": "true",
                  },
              )
              async with stdio_client(params) as (r, w):
                  async with ClientSession(r, w, read_timeout_seconds=timedelta(seconds=15)) as session:
                      await session.initialize()
                      tools = {t.name for t in (await session.list_tools()).tools}
                      assert {"search_commerce_documents", "read_commerce_section"} <= tools
                      res = await session.call_tool(
                          "search_commerce_documents",
                          {
                              "query": "machine wash cleaning care",
                              "market": "DE",
                              "canonical_product_id": "PRODUCT-CLOUDSTEP-RUNNER",
                              "top_k": 2,
                          },
                      )
                      assert not res.isError
                      data = res.structuredContent
                      assert data["schema_version"] == "commerce-retrieval-v1"
                      assert data["retrieval_mode"] == "dense_bm25_rrf"
                      assert data["degraded"] is False
                      assert len(data["sections"]) >= 1

          asyncio.run(verify())
          PY

  unit-regression-gate:
    name: Core Unit Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies (including PyMuPDF & ONNX)
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]" onnxruntime pymupdf
      - name: Run full unit suite & verify zero regressions
        run: |
          set +e
          .venv/bin/python -m pytest tests/unit --junitxml=/tmp/unit-report.xml -q --tb=short
          set -e
          .venv/bin/python - <<'PY'
          import subprocess, sys, xml.etree.ElementTree as ET
          from pathlib import Path

          backlog = {
              line.strip()
              for line in Path(".ai/unit_backlog.txt").read_text().splitlines()
              if line.strip() and not line.strip().startswith("#")
          }
          diff_proc = subprocess.run(
              ["git", "diff", "--name-only", "origin/dev...HEAD"],
              capture_output=True, text=True, check=False
          )
          touched_tests = {
              f.strip() for f in diff_proc.stdout.splitlines() if f.strip().startswith("tests/")
          }

          root = ET.parse("/tmp/unit-report.xml").getroot()
          failed_ids = set()
          for tc in root.iter("testcase"):
              if tc.find("failure") is not None or tc.find("error") is not None:
                  cls = tc.attrib.get("classname", "")
                  name = tc.attrib.get("name", "")
                  parts = cls.split(".")
                  if len(parts) >= 3 and parts[0] == "tests":
                      # Reconstruct file::Class::test or file::test
                      fpath = "/".join(parts[:3]) + ".py"
                      rest = "::".join(parts[3:] + [name])
                      failed_ids.add(f"{fpath}::{rest}")
                  else:
                      failed_ids.add(f"{cls}::{name}")

          new_regressions = failed_ids - backlog
          touched_failures = {
              fid for fid in failed_ids if fid.split("::")[0] in touched_tests
          }
          resolved = backlog - failed_ids

          print(f"Total current unit failures: {len(failed_ids)} (known backlog: {len(backlog)}, newly resolved in this branch: {len(resolved)})")
          if resolved:
              print("Resolved backlog items:", sorted(resolved))
          if new_regressions:
              print("❌ BLOCKING: New unit regressions introduced:", sorted(new_regressions))
              sys.exit(1)
          if touched_failures:
              print("❌ BLOCKING: Modified test files still have failures:", sorted(touched_failures))
              sys.exit(1)
          print("✅ Zero unit regressions introduced.")
          PY
